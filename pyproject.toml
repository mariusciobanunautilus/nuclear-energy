[project]
name = "nuclear-energy"
version = "0.1.0"
description = "Nuclear energy intelligence ingestion and analysis pipeline."
requires-python = ">=3.9"
dependencies = [
  "alembic>=1.13",
  "beautifulsoup4>=4.12",
  "feedparser>=6.0",
  "httpx>=0.27",
  "openai>=1.40",
  "pandas>=2.0",
  "plotly>=5.22",
  "psycopg[binary]>=3.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-dotenv>=1.0",
  "sqlalchemy>=2.0",
  "streamlit>=1.36",
  "trafilatura>=1.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
]

[project.scripts]
nuclear-energy = "nuclear_energy.cli:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
