name: Public Source Ingest

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Refresh scope"
        required: true
        default: all
        type: choice
        options:
          - all
          - official-transactions
          - documents
          - energy
          - live-generation
  schedule:
    - cron: "17 6 * * *"

jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      INGEST_MODE: ${{ github.event.inputs.mode || 'all' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Ingest public sources
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is not configured; skipping scheduled ingest."
            exit 0
          fi

          case "$INGEST_MODE" in
            all|official-transactions|documents|energy|live-generation)
              echo "Running public ingest mode: $INGEST_MODE"
              ;;
            *)
              echo "Unsupported ingest mode: $INGEST_MODE"
              exit 1
              ;;
          esac

          if [ "$INGEST_MODE" = "all" ] || [ "$INGEST_MODE" = "documents" ]; then
            nuclear-energy ingest-rss --limit 50
            nuclear-energy ingest-federal-register --limit 50
            nuclear-energy ingest-eur-lex --limit 50
            nuclear-energy ingest-gdelt --limit 75 --timespan 3days || echo "GDELT ingest skipped or rate-limited."
            nuclear-energy extract-documents --limit 120
            nuclear-energy detect-transactions --limit 1000
            nuclear-energy detect-events --limit 1000
            nuclear-energy sync-events
            nuclear-energy sync-relationships
            if [ -n "$OPENAI_API_KEY" ]; then
              nuclear-energy embed-chunks --limit 500
            else
              echo "OPENAI_API_KEY secret is not configured; skipping embeddings."
            fi
          fi

          if [ "$INGEST_MODE" = "all" ] || [ "$INGEST_MODE" = "energy" ]; then
            nuclear-energy ingest-energy --since-year 2000
          fi

          if [ "$INGEST_MODE" = "all" ] || [ "$INGEST_MODE" = "live-generation" ]; then
            nuclear-energy ingest-live-generation --country ROU
          fi

          if [ "$INGEST_MODE" = "all" ] || [ "$INGEST_MODE" = "official-transactions" ]; then
            nuclear-energy ingest-usaspending --limit 50 || echo "USAspending ingest skipped or unavailable."
            nuclear-energy ingest-eu-ted --limit 50 || echo "EU TED ingest skipped or unavailable."
            nuclear-energy sync-events
            nuclear-energy sync-relationships
          fi
